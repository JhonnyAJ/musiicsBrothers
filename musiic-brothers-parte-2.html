<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Musiic Brothers - Parte 2</title>
  <link rel="stylesheet" href="css/game.css" />
  <link rel="stylesheet" href="css/dialogue.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="game-page">
  <main id="game-container" class="game-container">
    <section id="game-canvas" class="game-canvas">
      <div class="stage-message">Cargando Musiic Brothers - Parte 2...</div>
      <div id="game-layer" class="game-layer"></div>
      <div id="interaction-prompt" class="interaction-prompt hidden">Presiona Q para hablar</div>
      <div id="chapter-overlay" class="chapter-overlay hidden"></div>
    </section>
    <aside id="hud" class="hud">
      <div class="hud-item" id="hud-charge">Carga: 0%</div>
      <div class="hud-item" id="hud-life">Vidas: 3</div>
      <div class="hud-item" id="hud-checkpoint">Checkpoint: 1</div>
      <div class="hud-item" id="hud-chapter">Capítulo 1: Aldea Perdida</div>
      <div class="hud-item" id="hud-fragments">Fragmentos: 0</div>
    </aside>
    <section id="dialogue-panel" class="dialogue-panel hidden">
      <div id="dialogue-text" class="dialogue-text"></div>
      <button id="dialogue-next" class="dialogue-next">Continuar</button>
    </section>
  </main>

  <script src="js/assets-loader.js"></script>
  <script src="js/input.js"></script>
  <script src="js/player.js"></script>
  <script src="js/attack.js"></script>
  <script src="js/enemy.js"></script>
  <script src="js/npc.js"></script>
  <script src="js/dialogue.js"></script>
  <script src="js/chapter.js"></script>
  <script src="js/collectibles.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
