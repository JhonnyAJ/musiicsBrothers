<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Plataforma en Pantalla Fija</title>
  <style>
    html {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden; /* Ocultar scrollbars */
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: linear-gradient(to bottom, #1b1f3a, #2c3e50); /* Gradiente para el cielo */
    }

    /* Contenedor principal */
    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      background: url('ruta-a-tu-imagen-de-ciudad.jpg') no-repeat center bottom;
      background-size: cover; /* Asegura que la ciudad cubra todo el ancho */
    }

    /* Estilo para las gotas de lluvia */
    .rain {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none; /* Permite hacer clic a través de la lluvia */
      overflow: hidden;
    }

    /* Gotas individuales */
    .drop {
      position: absolute;
      width: 2px;
      height: 10px;
      background: rgba(255, 255, 255, 0.7); /* Color de la gota */
      animation: fall linear infinite;
      opacity: 0.8;
    }

    /* Animación de caída */
    @keyframes fall {
      0% {
        transform: translateY(-100%);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh);
        opacity: 0.1;
      }
    }

    /* Cuadro de diálogo */
    .dialog-box {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 130px;
      background-color: rgba(0, 0, 0, 0.8);
      color: white;
      display: flex;
      align-items: center;
      padding: 10px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    .dialog-box img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin-right: 15px;
    }

    .dialog-box p {
      margin: 0;
      font-size: 20px;
      line-height: 1.5;
    }

    /* Instrucciones */
    .instructions {
      position: fixed;
      bottom: 20px;
      right: 20px;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 16px;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 5px;
      display: none; /* Ocultar inicialmente */
    }

    .fade-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    z-index: 1000;
    opacity: 1;
    transition: opacity 2s ease-in-out;
    }
    .initial-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }

  .initial-overlay-text {
    color: white;
    font-size: 2em;
    text-align: center;
    cursor: pointer;
  }
  
  </style>
</head>

    // Desplazamiento de la cámara
    let cameraOffsetX = 0;

    // Dibuja el portal
    function drawPortal() {
      const gradient = ctx.createRadialGradient(
        portal.x - cameraOffsetX,
        portal.y - cameraOffsetY,
        10,
        portal.x - cameraOffsetX,
        portal.y - cameraOffsetY,
        portal.radius
      );
      gradient.addColorStop(0, 'blue');
      gradient.addColorStop(1, 'cyan');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(portal.x - cameraOffsetX, portal.y - cameraOffsetY, portal.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    // Dibuja al jugador
    function drawPlayer() {
      if (!player.visible) return;
      let imageToDraw = playerImage;

        if (player.isJumping) {
          imageToDraw = player.lastDirection === 'left' ? playerJumpImageInverse : playerJumpImage;
        } else if (player.dx !== 0) {
          // Si se está moviendo, alterna entre las imágenes de caminar
          if (player.lastDirection === 'right') {
            imageToDraw = player.walkFrame === 0 ? playerWalkImage1 : playerWalkImage2;
          } else if (player.lastDirection === 'left') {
            imageToDraw = player.walkFrame === 0 ? playerWalkImage1Inverse : playerWalkImage2Inverse;
          }
        } 
        else{
          imageToDraw = player.lastDirection === 'left' ? playerImageInverse : playerImage;
        }
      ctx.drawImage(
        imageToDraw,
        player.frameX * player.frameWidth,
        player.frameY * player.frameHeight,
        player.frameWidth,
        player.frameHeight,
        player.x - cameraOffsetX,
        player.y - cameraOffsetY,
        player.width,
        player.height
      );
    }

    function drawJumpPlayer() {
      ctx.drawImage(
        playerJumpImage,
        player.frameX * player.frameWidth,
        player.frameY * player.frameHeight,
        player.frameWidth,
        player.frameHeight,
        player.x - cameraOffsetX,
        player.y - cameraOffsetY,
        player.width,
        player.height
      );
    }

    // Dibujar proyectiles
    function drawProjectiles() {
      ctx.fillStyle = 'blue';
      projectiles.forEach(proj => {
        ctx.fillRect(proj.x - cameraOffsetX, proj.y - cameraOffsetY, proj.width, proj.height);
      });
    }

    // Lanza proyectiles
    function shootProjectile() {
      projectiles.push({
        x: player.x + player.width / 2,
        y: player.y + player.height / 2,
        width: 10,
        height: 5,
        speed: 10,
        direction: player.dx >= 0 ? 1 : -1, // Dirección del disparo
      });
    }

    // Mover proyectiles
    function updateProjectiles() {
      projectiles.forEach((proj, index) => {
        proj.x += proj.speed * proj.direction;

        // Eliminar proyectil si sale del canvas
        if (proj.x < 0 || proj.x > canvas.width) {
          projectiles.splice(index, 1);
        }
      });
    }

    // Detectar colisión de proyectiles con enemigos
    function checkProjectileCollisions() {
      projectiles.forEach((proj, projIndex) => {
        enemies.forEach((enemy, enemyIndex) => {
          if (
            proj.x < enemy.x + enemy.width &&
            proj.x + proj.width > enemy.x &&
            proj.y < enemy.y + enemy.height &&
            proj.y + proj.height > enemy.y
          ) {
            // Eliminar enemigo y proyectil al colisionar
            enemies.splice(enemyIndex, 1);
            projectiles.splice(projIndex, 1);
          }
        });
      });
    }

      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      ctx.fill();
    }

    // Dibuja plataformas con gradiente
    function drawPlatforms() {
      platforms.forEach((platform, index) => {
        if (index === 0) {
          // Primera plataforma con gradiente vertical
          const gradient = ctx.createLinearGradient(platform.x - cameraOffsetX, platform.y - cameraOffsetY, platform.x - cameraOffsetX, platform.y - cameraOffsetY + platform.height);
          
          gradient.addColorStop(0, 'purple'); // Color al inicio del gradiente
          gradient.addColorStop(0.5, 'pink'); // Color en el medio del gradiente
          gradient.addColorStop(1, 'gray'); // Color al final del gradiente
          ctx.fillStyle = gradient;
          ctx.fillRect(platform.x - cameraOffsetX, platform.y - cameraOffsetY, platform.width, platform.height);
        } else {
          // Otras plataformas con gradiente y bordes redondeados
          const gradient = ctx.createLinearGradient(platform.x - cameraOffsetX, platform.y - cameraOffsetY, platform.x - cameraOffsetX + platform.width, platform.y - cameraOffsetY);
          gradient.addColorStop(0, 'purple'); // Color al inicio del gradiente
          gradient.addColorStop(0.5, 'pink'); // Color en el medio del gradiente
          gradient.addColorStop(1, 'purple'); // Color al final del gradiente
          ctx.fillStyle = gradient;
          drawRoundedRect(platform.x - cameraOffsetX, platform.y - cameraOffsetY, platform.width, platform.height, 7);
        }
      });
    }

    // Dibuja las monedas
    function drawCoins() {
      ctx.fillStyle = 'gold';
      coins.forEach((coin) => {
        ctx.beginPath();
        ctx.arc(coin.x - cameraOffsetX, coin.y - cameraOffsetY, coin.width / 2, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    // Mostrar el puntaje
    function drawScore() {
      ctx.fillStyle = 'black';
      ctx.font = '20px Arial';
      ctx.fillText('Score: ' + score, 10, 30);
    }

    // Dibujar enemigos
    function drawEnemies() {
      enemies.forEach(enemy => {
    ctx.drawImage(
      enemyImage, // Imagen del enemigo
      enemy.x - cameraOffsetX, // Posición X ajustada por la cámara
      enemy.y - cameraOffsetY, // Posición Y ajustada por la cámara
      enemy.width, // Ancho del enemigo
      enemy.height // Altura del enemigo
    );
  });
    }

    // Mover enemigos
    function updateEnemies() {
      enemies.forEach(enemy => {
        enemy.x += enemy.speed * enemy.direction;

        // Cambiar dirección al llegar al borde de una plataforma
        if (enemy.x <= 0 || enemy.x + enemy.width >= canvas.width) {
          enemy.direction *= -1;
        }
      });
    }

    // Detectar colisión con enemigos
    function checkEnemyCollisions() {
      enemies.forEach(enemy => {
        if (
          player.x < enemy.x + enemy.width &&
          player.x + player.width > enemy.x &&
          player.y < enemy.y + enemy.height &&
          player.y + player.height > enemy.y
        ) {
          //  alert('¡Has perdido!');
          resetGame(); // Reiniciar el juego sin recargar la página
        }
      });
    }

    // Actualiza la posición del jugador
    function updatePlayer() {
      player.x += player.dx;
      player.dy += player.gravity;
      player.y += player.dy;

      // Evitar que el jugador se mueva a una posición con x menor a 0
      if (player.x < 0) {
        player.x = 0;
      }

      // Evitar que el jugador caiga por debajo del canvas
      if (player.y + player.height > canvas.height) {
        player.y = canvas.height - player.height;
        player.dy = 0;
        player.isJumping = false;
      }

      // Actualizar el desplazamiento de la cámara
      cameraOffsetX = player.x - canvas.width / 4; // Ajusta la posición horizontal de la cámara
      cameraOffsetY = player.y - (canvas.height * 3 / 4); // Ajusta la posición vertical de la cámara
    }

    // Controlar animación del jugador
    let frameCounter = 0;
  function updatePlayerAnimation() {
      if (player.dx !== 0 && !player.isJumping) {
        player.walkFrameCounter++;
        if (player.walkFrameCounter >= 25) { // Cambia 10 por menos para caminar más rápido
          player.walkFrame = (player.walkFrame + 1) % 2;
          player.walkFrameCounter = 0;
        }
      } else {
        player.walkFrame = 0;
        player.walkFrameCounter = 0;
      }
}

    // Reiniciar el juego
  function resetGame() {
    player.x = 50;
    player.y = canvas.height - 100;
    score = 0;
    coins = [
      { x: 350, y: canvas.height - 200, width: 20, height: 20 },
      { x: 500, y: canvas.height - 300, width: 20, height: 20 },
      { x: 700, y: canvas.height - 400, width: 20, height: 20 },
      { x: 900, y: canvas.height - 500, width: 20, height: 20 },
      { x: 1100, y: canvas.height - 600, width: 20, height: 20 },
      { x: 1300, y: canvas.height - 700, width: 20, height: 20 },
      { x: 1500, y: canvas.height - 800, width: 20, height: 20 },
      { x: 1700, y: canvas.height - 900, width: 20, height: 20 },
      { x: 1900, y: canvas.height - 1000, width: 20, height: 20 },
      { x: 2100, y: canvas.height - 1100, width: 20, height: 20 },
      { x: 1700, y: canvas.height - 1200, width: 20, height: 20 },
      { x: 1500, y: canvas.height - 1300, width: 20, height: 20 },
      { x: 1300, y: canvas.height - 1400, width: 20, height: 20 },
      { x: 1100, y: canvas.height - 1500, width: 20, height: 20 },
      { x: 900, y: canvas.height - 1600, width: 20, height: 20 },
      { x: 700, y: canvas.height - 1700, width: 20, height: 20 },
      { x: 500, y: canvas.height - 1800, width: 20, height: 20 },
      { x: 300, y: canvas.height - 1900, width: 20, height: 20 },
      { x: 100, y: canvas.height - 2000, width: 20, height: 20 },
    ];
  }


    // Detectar colisión con el portal
    function checkPortalCollision() {
    if (
        player.x < portal.x + portal.width &&
        player.x + player.width > portal.x &&
        player.y < portal.y + portal.height &&
        player.y + player.height > portal.y
    ) {
      player.visible = false; 
      if(localStorage.getItem('levelCompleted') === 'true') {
        return; // Evitar que el jugador pase al siguiente nivel si no ha completado el actual
      }
        // Detener el bucle del juego
        cancelAnimationFrame(gameLoop);
        localStorage.setItem('levelCompleted', 'true'); // Guardar el estado en localStorage


        // Obtener los elementos del DOM
        const overlay = document.getElementById('overlay');
        const loadingText = document.getElementById('loadingText');

        // Mostrar el overlay y el texto de "Cargando..."
        overlay.style.display = 'flex';
        overlay.style.backgroundColor = 'transparent';
        loadingText.style.opacity = '0';

        // Función para manejar las transiciones en secuencia
        function handleTransition(step) {
            switch (step) {
                case 1:
                    // Paso 1: Desvanecer a negro y mostrar "Cargando..."
                    overlay.style.backgroundColor = 'black';
                    loadingText.style.opacity = '1';
                    setTimeout(() => handleTransition(2), 2000); // Esperar 1 segundo
                    break;
                case 2:
                    // Paso 2: Cambiar a morado y ocultar "Cargando..."
                    overlay.style.backgroundColor = 'purple';
                    loadingText.style.opacity = '0';
                    setTimeout(() => handleTransition(3), 2000); // Esperar 1 segundo
                    break;
                case 3:
                    // Paso 3: Cambiar a blanco y mostrar "¡Nivel Completado!"
                    overlay.style.backgroundColor = 'white';
                    overlay.style.color = 'black';
                    overlay.textContent = '¡Nivel Completado!';
                    setTimeout(() => handleTransition(4), 3000); // Esperar 2 segundos
                    break;
                case 4:
                    // Paso 4: Mostrar "Capítulo 2" con efecto de sombras
                    overlay.textContent = 'Capítulo 2. Sombras del Camino';
                    overlay.style.textShadow = `
    0px 5px 10px rgba(0, 0, 0, 0.9), /* Sombra oscura cerca del texto */
    0px 10px 20px rgba(50, 50, 50, 0.7), /* Penumbra más suave */
    0px 15px 30px rgba(0, 0, 0, 0.5), /* Sombras profundas */
    0px 20px 40px rgba(30, 30, 30, 0.4), /* Efecto de niebla */
    0px 25px 50px rgba(10, 10, 10, 0.3) /* Distante y misterioso */
`;                  
                    overlay.style.cursor = 'pointer';
                    overlay.addEventListener('click', () => {
                        window.location.href = 'caminoAlDestino.html';
                    });
                    break;
            }
        }

        // Iniciar la secuencia de transiciones
        handleTransition(1);
    }
}

    // Detectar colisiones con plataformas
    function checkCollisions() {
      platforms.forEach((platform) => {
        if (
          player.x < platform.x + platform.width &&
          player.x + player.width > platform.x &&
          player.y + player.height > platform.y &&
          player.y + player.height - player.dy <= platform.y
        ) {
          player.y = platform.y - player.height;
          player.dy = 0;
          player.isJumping = false;
        }
      });
    }

    // Detectar colisiones con monedas
    function checkCoinCollisions() {
      coins = coins.filter((coin) => {
        if (
          player.x < coin.x + coin.width &&
          player.x + player.width > coin.x &&
          player.y < coin.y + coin.height &&
          player.y + player.height > coin.y
        ) {
          score += 10; // Incrementar el puntaje
          return false; // Eliminar la moneda
        }
        return true;
      });
    }

    // Redimensionar canvas y ajustar elementos
    window.addEventListener('resize', () => {
      const previousHeight = canvas.height;
      resizeCanvas();

      

      // Recalcular plataformas dinámicamente
      platforms = [
        { x: 0, y: canvas.height - 50, width: canvas.width * 2, height: 10 },
        { x: 300, y: canvas.height - 150, width: 100, height: 10 },
        { x: 450, y: canvas.height - 250, width: 100, height: 10 },
        { x: 600, y: canvas.height - 350, width: 100, height: 10 },
        { x: 800, y: canvas.height - 450, width: 100, height: 10 },
        { x: 1000, y: canvas.height - 550, width: 100, height: 10 },
        { x: 1200, y: canvas.height - 650, width: 100, height: 10 },
        { x: 1400, y: canvas.height - 750, width: 100, height: 10 },
        { x: 1600, y: canvas.height - 850, width: 100, height: 10 },
        { x: 1800, y: canvas.height - 950, width: 100, height: 10 },
        { x: 2000, y: canvas.height - 1050, width: 100, height: 10 },
        // Nuevas plataformas en zigzag
        { x: 1800, y: canvas.height - 1150, width: 100, height: 10 },
        { x: 1600, y: canvas.height - 1250, width: 100, height: 10 },
        { x: 1400, y: canvas.height - 1350, width: 100, height: 10 },
        { x: 1200, y: canvas.height - 1450, width: 100, height: 10 },
        { x: 1000, y: canvas.height - 1550, width: 100, height: 10 },
        { x: 800, y: canvas.height - 1650, width: 100, height: 10 },
        { x: 600, y: canvas.height - 1750, width: 100, height: 10 },
        { x: 400, y: canvas.height - 1850, width: 100, height: 10 },
        { x: 200, y: canvas.height - 1950, width: 100, height: 10 },
      ];

      // Ajustar posición del jugador a la plataforma
      player.y = (player.y / previousHeight) * canvas.height;
    });

    // Limpia el canvas
    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // Bucle principal del juego
    function gameLoop() {
      clearCanvas();
      updatePlayer();
      updateEnemies();
      updateProjectiles();
      updatePlayerAnimation();
      drawPlatforms();
      drawCoins();
      drawEnemies();
      drawProjectiles();
      checkCollisions();
      checkCoinCollisions();
      checkEnemyCollisions();
      checkProjectileCollisions();
      drawPlayer();
      drawPortal();
      checkPortalCollision();
      drawScore();
      requestAnimationFrame(gameLoop);
    }

    // Controles
    document.addEventListener('keydown', (e) => {
      if (dialogActive) {
        if (e.key === "x" || e.key === "X") {
            updateDialog();
        }
        return; // No permitir el movimiento si el diálogo está activo
    }
      if (e.key === 'ArrowRight' || e.key === 'd'){
        player.dx = player.speed;
        player.lastDirection = 'right';

      }
      
      if (e.key === 'ArrowLeft' || e.key === 'a'){
        player.dx = -player.speed;
        player.lastDirection = 'left';
      } 
      if ((e.key === 'ArrowUp' || e.key === 'w') && !player.isJumping) {
        player.dy = player.jumpForce;
        player.isJumping = true;
        //drawJumpPlayer();
      }
      if (e.key === "x" || e.key === "X") {
    updateDialog();
  }
      if (e.key === ' ') {
    shootProjectile();
  }
    });

    document.addEventListener('keyup', (e) => {
      if (dialogActive) return; // No permitir el movimiento si el diálogo está activo

      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === 'd' || e.key === 'a') player.dx = 0;
    });

    // Carga el juego
    playerImage.onload = () => {
      localStorage.setItem('levelCompleted', 'false'); 
      gameLoop();
    };
  </script>
