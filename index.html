<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciudad Futurista con Lluvia</title>
  <style>
    /* Estilos generales del body */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: linear-gradient(to bottom, #0a0f2c, #1b1f3a); /* Gradiente para el cielo */
    }

    /* Contenedor principal */
    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Edificios */
    .buildings {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 40%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .building {
      position: relative;
      width: 8%;
      height: 60%; /* Altura base del edificio */
      background: #1a1a2e;
      border: 1px solid #111;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.3); /* Brillo futurista */
    }

    .building:nth-child(odd) {
      height: 70%; /* Edificios de diferente altura */
    }

    /* Ventanas de los edificios */
    .window {
      position: absolute;
      width: 10px;
      height: 10px;
      background: rgba(255, 255, 255, 0.6);
      margin: 3px;
      border-radius: 2px;
      box-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
    }

    /* Añadir ventanas a cada edificio */
    .building .window:nth-child(1) { top: 10%; left: 15%; }
    .building .window:nth-child(2) { top: 10%; left: 40%; }
    .building .window:nth-child(3) { top: 20%; left: 65%; }
    .building .window:nth-child(4) { top: 30%; left: 20%; }
    .building .window:nth-child(5) { top: 40%; left: 50%; }
    .building .window:nth-child(6) { top: 50%; left: 75%; }

    /* Estilo para la lluvia */
    .rain {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }

    /* Gotas individuales */
    .drop {
      position: absolute;
      width: 2px;
      height: 10px;
      background: rgba(255, 255, 255, 0.7);
      animation: fall linear infinite;
      opacity: 0.8;
    }

    /* Animación de caída */
    @keyframes fall {
      0% {
        transform: translateY(-100%);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh);
        opacity: 0.1;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <!-- Edificios -->
    <div class="buildings">
      <div class="building">
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
      </div>
      <div class="building">
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
      </div>
      <div class="building">
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
      </div>
      <div class="building">
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
      </div>
      <div class="building">
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
      </div>
    </div>

    <!-- Lluvia -->
    <div class="rain">
      <!-- Las gotas se generan dinámicamente con JavaScript -->
    </div>
  </div>

  <script>
    window.location.href = 'Menu/menu.html';

    </script>
</body>
</html>
