<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musiic's Brothers</title>
    <link rel="stylesheet" href="menuStyles.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="particles-canvas" style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;pointer-events:none;"></canvas>
  
  <div id="initial-overlay" class="initial-overlay" role="button" tabindex="0" aria-label="Haz clic para continuar">
    <div class="initial-overlay-text">Haz clic para continuar</div>
  </div>

  <div id="story-overlay" class="story-overlay" aria-live="polite" aria-label="Historia de introducción">
    <div id="story-text" class="story-text"></div>
  </div>

  <main class="menu-container" id="menu-main" aria-label="Menú principal">
    <h1 class="game-title">Musiic's Brothers</h1>
    <nav class="menu-options" aria-label="Opciones del menú principal">
      <button id="play-button" data-action="play">Jugar</button>
      <button id="continue-button" data-action="continue">Continuar</button>
      <button id="chapters-button" data-action="chapter-select">Selección de capítulos</button>
      <button id="options-button" data-action="options">Opciones</button>
      <button id="exit-button" data-action="exit">Salir</button>
      <button id="credits-button" data-action="credits">Créditos</button>
    </nav>
  </main>

  <section class="credits-overlay" id="credits-overlay" role="dialog" aria-modal="true" aria-labelledby="credits-title">
    <div class="credits-content">
      <h2 id="credits-title" class="game-title">Créditos</h2>
      <div class="credits-body">
        <p><b>Desarrollo y música</b></p>
        <img class="credit-img" src="../assets/Creditos/nonox.png" alt="Desarrollador">
        <p><b>Arte:</b></p>
        <img class="credit-img" src="../assets/Creditos/saru.png" alt="Arte">
      </div>
      <button id="back-menu" class="back-menu-button" data-action="back">Volver</button>
    </div>
  </section>

  <audio id="background-music" loop>
    <source src="../assets/sonidos/menu.mp3" type="audio/mpeg">
    Tu navegador no soporta la reproducción de audio.
  </audio>

  <script src="menuScript.js"></script>
</body>
</html>
